kind = "web"
previewPath = "/"
title = "Digital Electronics Virtual Lab"
description = "A responsive browser-based teaching lab for exploring half adders and full adders with live logic gates, signal flow, truth tables, explanations, binary addition, and a scored quiz."
version = "1.0.0"
id = "artifacts/digital-electronics-lab"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24313

[services.development]
run = "pnpm --filter @workspace/digital-electronics-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/digital-electronics-lab", "run", "build" ]
serve = "static"
publicDir = "artifacts/digital-electronics-lab/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24313"
BASE_PATH = "/"
